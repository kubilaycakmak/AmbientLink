name: Windows build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
      - run: .\build.ps1
        shell: powershell
      - uses: actions/upload-artifact@v4
        with:
          name: AmbientLink-windows-x64
          path: |
            dist/AmbientLink-*-windows-x64.zip
            dist/SHA256SUMS.txt
